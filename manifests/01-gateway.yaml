# Surface d’entrée Gateway API (Envoy Gateway).
# Flagger attache sa HTTPRoute canary à ce Gateway (hosts: podinfo.local).
# Le Mac n’atteint pas l’IP LoadBalancer Kind → make port (kubectl port-forward :8080).
apiVersion: v1
kind: Namespace
metadata:
  name: flagger-demo
  labels:
    app.kubernetes.io/part-of: flagger-platform-lab
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg-flagger-lab
spec:
  # Doit matcher le controller Envoy Gateway installé par bootstrap.
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: flagger-demo
spec:
  gatewayClassName: eg-flagger-lab
  listeners:
    - name: http
      hostname: podinfo.local
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
