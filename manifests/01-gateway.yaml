apiVersion: v1
kind: Namespace
metadata:
  name: flagger-demo
  labels:
    app.kubernetes.io/part-of: flagger-platform-lab
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg-flagger-lab
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: flagger-demo
spec:
  gatewayClassName: eg-flagger-lab
  listeners:
    - name: http
      hostname: podinfo.local
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
