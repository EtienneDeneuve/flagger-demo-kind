# Flagger gere les Services et la HTTPRoute ; ne pas les creer manuellement.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: flagger-demo
  labels:
    app: podinfo
spec:
  replicas: 1
  minReadySeconds: 2
  progressDeadlineSeconds: 90
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9797"
    spec:
      containers:
        - name: podinfod
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          imagePullPolicy: IfNotPresent
          command: ["./podinfo"]
          args:
            - --port=9898
            - --port-metrics=9797
            - --grpc-port=9999
            - --level=info
            - --random-error=false
          env:
            - name: PODINFO_UI_MESSAGE
              value: "FLAGGER LAB | VERSION STABLE"
            - name: PODINFO_UI_COLOR
              value: "#285F80"
          ports:
            - name: http
              containerPort: 9898
            - name: http-metrics
              containerPort: 9797
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
