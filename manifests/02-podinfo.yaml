# Deployment « target » observé par Flagger.
# Flagger crée ensuite : podinfo-primary, Services, HTTPRoute — ne pas les créer à la main.
#
# PODINFO_UI_MESSAGE / COLOR = signal visible dans make browser / curl /api/info
# (VERSION STABLE → V2 → V3 dégradée → V4 beta selon les scénarios).
#
# command: ["./podinfo"] est requis : l’image définit CMD, et Kubernetes
# remplacerait autrement le binaire si seuls args étaient fournis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: flagger-demo
  labels:
    app: podinfo
spec:
  replicas: 1
  minReadySeconds: 2
  progressDeadlineSeconds: 90
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
      annotations:
        # Scrapé par prometheus-lab (voir manifests/03-prometheus.yaml).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9797"
    spec:
      containers:
        - name: podinfod
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          imagePullPolicy: IfNotPresent
          command: ["./podinfo"]
          args:
            - --port=9898
            - --port-metrics=9797
            - --grpc-port=9999
            - --level=info
            # Erreurs aléatoires désactivées : le TP 2 injecte les 5xx via l’API fault.
            - --random-error=false
          env:
            - name: PODINFO_UI_MESSAGE
              value: "FLAGGER LAB | VERSION STABLE"
            - name: PODINFO_UI_COLOR
              value: "#285F80"
          ports:
            - name: http
              containerPort: 9898
            - name: http-metrics
              containerPort: 9797
          # Ready ≠ « bon pour 100 % du trafic » — c’est tout l’intérêt de Flagger (TP 2).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
