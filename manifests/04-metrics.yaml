# MetricTemplates Flagger → Prometheus du lab (prometheus-lab).
#
# Important pédagogie :
# - on scrape UNIQUEMENT job=podinfo-canary (jamais la primary) ;
# - {{ interval }} = Canary metrics[].interval (ici 10s), PAS une fenêtre fixe 1m ;
#   sinon les 5xx du scénario « fail » restent dans rate() et font échouer l’A/B suivant.
#
# Docs : docs/01-architecture.md, docs/05-tp-participant.md (TP 0 / pause post-TP2).
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: podinfo-canary-error-rate
  namespace: flagger-system
spec:
  provider:
    type: prometheus
    address: http://prometheus-lab.flagger-system.svc.cluster.local:9090
  query: |
    100 * (
      (sum(rate(http_requests_total{job="podinfo-canary",status=~"5.."}[{{ interval }}])) or vector(0))
      /
      clamp_min((sum(rate(http_requests_total{job="podinfo-canary"}[{{ interval }}])) or vector(0)), 0.001)
    )
---
# Sans scrape canary « up », une absence de série ne doit pas passer pour « 0 % d’erreurs ».
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: podinfo-canary-scrape-up
  namespace: flagger-system
spec:
  provider:
    type: prometheus
    address: http://prometheus-lab.flagger-system.svc.cluster.local:9090
  query: |
    sum(up{job="podinfo-canary"}) or vector(0)
