# Canary « A/B » (copie de référence bootstrap).
# En séance TP, préférer manifests/tp/03-ab-canary.yaml (même contenu, guide dédié).
# Pendant Progressing : seul x-canary: always voit la canary ; après promote, plus de match.
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: podinfo
  namespace: flagger-demo
spec:
  provider: gatewayapi:v1
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: podinfo
  progressDeadlineSeconds: 180
  service:
    port: 9898
    targetPort: 9898
    portName: http
    hosts:
      - podinfo.local
    gatewayRefs:
      - name: lab-gateway
        namespace: flagger-demo
  analysis:
    interval: 10s
    threshold: 2
    # Nombre de cycles d’analyse réussis avant promote (au lieu de poids 25→50).
    iterations: 4
    match:
      # Trafic SANS ce header → 100 % primary pendant l’analyse.
      - headers:
          x-canary:
            exact: always
    metrics:
      - name: podinfo-canary-error-rate
        templateRef:
          name: podinfo-canary-error-rate
          namespace: flagger-system
        thresholdRange:
          max: 5
        interval: 10s
      - name: podinfo-canary-scrape-up
        templateRef:
          name: podinfo-canary-scrape-up
          namespace: flagger-system
        thresholdRange:
          min: 1
        interval: 10s
